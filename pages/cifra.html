<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riffly - Cifra</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cifra.css">
    <link rel="shortcut icon" href="../assets/design/logo/logo.png" type="image/x-icon">

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#5B21B6">
    <link rel="apple-touch-icon" href="../assets/design/logo/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Riffly">
</head>
<body>
    <header>
        <a href="../index.html"><img src="../assets/design/logo/logo.png" alt="Riffly" class="header-logo"></a>

        <div class="search-wrapper">
            <input type="search" name="search" id="search" class="search-bar" placeholder="Pesquise por uma música..." autocomplete="off">
            <img src="../assets/design/icon/search.png" alt="" class="search-icon">
            <ul class="search-results" id="searchResults"></ul>
        </div>

        <button class="app-select-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="sidebar" aria-label="Selecionar aplicativo">
            <img src="../assets/design/icon/menu.png" alt="Menu">
        </button>
    </header>

    <aside class="sidebar" id="sidebar">
        <ul>
            <li><a href="tuner_cromatic.html">Afinador Cromático</a></li>
            <li><a href="tuner_manual.html">Afinador Manual</a></li>
            <li><a href="metronome.html">Metrônomo</a></li>
            <li><a href="login.html">Fazer login</a></li>
        </ul>
    </aside>

    <main class="page cifra-page">
        <p class="cifra-status" id="cifraStatus">Carregando...</p>

        <div class="cifra-main" id="cifraMain" style="display: none;">
            <div>
                <h1 class="cifra-title" id="cifraTitulo"></h1>
                <p class="cifra-author" id="cifraAutor"></p>
            </div>
            <div class="cifra-content">
                <img class="cifra-foto" id="cifraFoto" alt="Foto da cifra">
            </div>
        </div>

        <aside class="cifra-card" id="cifraCard" style="display: none;">
            <iframe class="cifra-player" id="cifraPlayer" title="Player da música" allowfullscreen></iframe>

            <p class="cifra-info" id="cifraBpm"></p>
            <p class="cifra-info" id="cifraAfinacao"></p>

            <a class="cifra-action" id="linkAfinador" href="tuner_manual.html">Ir para o afinador</a>
            <a class="cifra-action" id="linkMetronomo" href="metronome.html">Ir para o Metrônomo</a>
        </aside>
    </main>

    <script src="../js/main.js" defer></script>
    <script src="../js/search.js" defer></script>
    <script src="../js/cifra-view.js" defer></script>
</body>
</html>
