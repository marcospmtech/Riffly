<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riffly - Criar conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="shortcut icon" href="../assets/design/logo/logo.png" type="image/x-icon">

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#5B21B6">
    <link rel="apple-touch-icon" href="../assets/design/logo/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Riffly">
</head>
<body>
    <header>
        <a href="../index.html"><img src="../assets/design/logo/logo.png" alt="Riffly" class="header-logo"></a>

        <div class="search-wrapper">
            <input type="search" name="search" id="search" class="search-bar" placeholder="Pesquise por uma música..." autocomplete="off">
            <img src="../assets/design/icon/search.png" alt="" class="search-icon">
            <ul class="search-results" id="searchResults"></ul>
        </div>

        <button class="app-select-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="sidebar" aria-label="Selecionar aplicativo">
            <img src="../assets/design/icon/menu.png" alt="Menu">
        </button>
    </header>

    <aside class="sidebar" id="sidebar">
        <ul>
            <li><a href="tuner_cromatic.html">Afinador Cromático</a></li>
            <li><a href="tuner_manual.html">Afinador Manual</a></li>
            <li><a href="metronome.html">Metrônomo</a></li>
            <li><a href="login.html">Fazer login</a></li>
        </ul>
    </aside>

    <main class="page auth-page">
        <form class="auth-card" id="registroForm">
            <h1 class="auth-title">Criar conta</h1>

            <div class="auth-field">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
                <span class="field-error" data-error-for="nome"></span>
            </div>

            <div class="auth-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                <span class="field-error" data-error-for="email"></span>
            </div>

            <div class="auth-field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
                <span class="field-error" data-error-for="senha"></span>
            </div>

            <div class="auth-field">
                <label for="senhaAdmin">Senha de administrador</label>
                <input type="password" id="senhaAdmin" name="senhaAdmin" placeholder="(escreva somente se for administrador)">
            </div>

            <button class="auth-submit" type="submit">Criar conta</button>

            <p class="auth-switch">Já tem conta? <a href="login.html">Entrar</a></p>
        </form>
    </main>

    <script src="../js/main.js" defer></script>
    <script src="../js/search.js" defer></script>
    <script src="../js/auth.js" defer></script>
</body>
</html>
